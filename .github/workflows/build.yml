name: Build vixc

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Semantic pre-release identifier: 0.5.0 Beta Candidate（Beta 预选版）
  VIXC_VERSION: 0.5.0-beta.1
  VIXC_CHANNEL: beta-candidate

jobs:
  build:
    name: Build vixc 0.5.0-beta.1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gpg build-essential pkg-config zlib1g-dev libzstd-dev
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21 llvm-21-dev liblld-21-dev libgc-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
          sudo ln -sf /usr/bin/llvm-config-21 /usr/bin/llvm-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld libatomic_ops bdw-gc pkg-config make
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-boehm-gc
            mingw-w64-clang-x86_64-pkgconf

      - name: Build vixc (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            make -j2 all VIXC_RUN="" GC_WRAP_LDFLAGS="" LLD_LIBS=""
          else
            make -j2 all VIXC_RUN=""
          fi

      - name: Build vixc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j2 all VIXC_RUN="" GC_WRAP_LDFLAGS="" LLD_LIBS=""

      - name: Package compiler
        shell: bash
        run: |
          set -euo pipefail
          package_root="package/vixc-${VIXC_VERSION}-${{ runner.os }}"
          mkdir -p "$package_root"
          cp build/vixc "$package_root/"
          # These directories are the Vix runtime/standard library shipped
          # with the compiler. Include libc as well when a branch provides it.
          cp -r core std lib runtime "$package_root/"
          if [ -d libc ]; then cp -r libc "$package_root/"; fi
          cat > "$package_root/VERSION" <<EOF
          Vixc ${VIXC_VERSION}
          Release channel: ${VIXC_CHANNEL}
          English: Beta Candidate
          中文：Beta 预选版
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "vixc-${VIXC_VERSION}-windows-x86_64.zip" "./${package_root}"/*
          elif [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf "vixc-${VIXC_VERSION}-macos-arm64.tar.gz" -C package "vixc-${VIXC_VERSION}-macOS"
          else
            tar -czf "vixc-${VIXC_VERSION}-linux-x86_64.tar.gz" -C package "vixc-${VIXC_VERSION}-Linux"
          fi

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixc-${{ env.VIXC_VERSION }}-${{ runner.os }}
          path: vixc-*
          if-no-files-found: error
