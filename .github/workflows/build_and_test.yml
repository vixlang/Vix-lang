name: Vix Compiler CI

on:
  push:
    branches: [main, stage0, develop]
    tags: ['v*']
  pull_request:
    branches: [main, stage0, develop]

env:
  VIX_DEBUG: "0"

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Build vixc compiler on Linux and Windows
  # ═══════════════════════════════════════════════════════════════
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            artifact_name: vixc
          - os: windows-latest
            name: Windows x64
            artifact_name: vixc.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Linux Build ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm flex bison make git
          clang --version
          llvm-config --version || true

      - name: Build vixc (Linux)
        if: runner.os == 'Linux'
        working-directory: ./src
        run: |
          make clean || true
          make -j$(nproc)
          ls -lh vixc
          ./vixc -v

      - name: Upload vixc artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vixc-linux-x64
          path: src/vixc
          retention-days: 30

      # ── Windows Build ──
      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $url = "https://gh-proxy.org/https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "LLVM-18.1.8-win64.exe"
          Start-Process -FilePath "LLVM-18.1.8-win64.exe" -ArgumentList "/S" -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LLVM_HOME=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Win flex-bison (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install winflexbison -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build vixc (Windows)
        if: runner.os == 'Windows'
        working-directory: ./src
        shell: cmd
        run: |
          build_win.bat

      - name: Upload vixc artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vixc-windows-x64
          path: src/vixc.exe
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  #  Run tests using the built vixc
  # ═══════════════════════════════════════════════════════════════
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vixc-linux-x64
            compiler_path: vixc
            bin_dir: .
          - os: windows-latest
            artifact: vixc-windows-x64
            compiler_path: vixc.exe
            bin_dir: .

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download vixc artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src

      - name: Make vixc executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x src/vixc

      - name: Download vixc artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src

      - name: Verify vixc works
        working-directory: ./src
        run: |
          ./${{ matrix.compiler_path }} -v

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PATH="$PWD/src:$PATH"
          cd test
          python3 run.py
        continue-on-error: true
 
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="$PWD/src:$PATH"
          cd test
          python3 run.py
        continue-on-error: true
